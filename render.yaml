services:
  - type: web
    name: options-trader
    runtime: python
    plan: starter
    buildCommand: bash build.sh
    startCommand: bash start.sh
    envVars:
      - key: NODE_VERSION
        value: 18
      - key: PYTHON_VERSION
        value: 3.12.0
      - key: NODE_ENV
        value: production
      - key: PYTHON_EXECUTABLE
        value: ./venv/bin/python3
    # Health check disabled to avoid timeout issues during scans
    # healthCheckPath: /
    autoDeploy: true  # Keep auto-deploy for web service so updates can be pushed

  # Background scanner (strict mode) - DISABLED (using on-demand scanning instead)
  # Keeping config for reference but suspended to save build minutes
  # - type: cron
  #   name: options-scanner-strict
  #   runtime: python
  #   plan: starter
  #   schedule: "*/10 * * * *"  # Every 10 minutes
  #   buildCommand: bash build.sh
  #   startCommand: python3 scripts/background_scanner.py --filter-mode strict --max-symbols 15
  #   envVars:
  #     - key: NODE_VERSION
  #       value: 18
  #     - key: PYTHON_VERSION
  #       value: 3.12
  #     - key: NODE_ENV
  #       value: production
  #     - key: PYTHON_EXECUTABLE
  #       value: ./venv/bin/python3
  #     - key: DISABLE_BACKTESTING
  #       value: "1"
  #   autoDeploy: false

  # Background scanner (relaxed mode) - DISABLED (using on-demand scanning instead)
  # Keeping config for reference but suspended to save build minutes
  # - type: cron
  #   name: options-scanner-relaxed
  #   runtime: python
  #   plan: starter
  #   schedule: "5-59/10 * * * *"  # Every 10 minutes, offset by 5 minutes
  #   buildCommand: bash build.sh
  #   startCommand: python3 scripts/background_scanner.py --filter-mode relaxed --max-symbols 15
  #   envVars:
  #     - key: NODE_VERSION
  #       value: 18
  #     - key: PYTHON_VERSION
  #       value: 3.12
  #     - key: NODE_ENV
  #       value: production
  #     - key: PYTHON_EXECUTABLE
  #       value: ./venv/bin/python3
  #     - key: DISABLE_BACKTESTING
  #       value: "1"
  #   autoDeploy: false

  # Cache warmup - runs 5 minutes before market open to pre-fetch fresh data
  - type: cron
    name: cache-warmup
    runtime: python
    plan: starter
    schedule: "25 13 * * 1-5"  # 9:25 AM ET (13:25 UTC) on weekdays
    buildCommand: bash build.sh
    startCommand: curl -f -X GET "${RENDER_EXTERNAL_URL}/api/warmup-cache" || exit 0
    envVars:
      - key: NODE_VERSION
        value: 18
      - key: PYTHON_VERSION
        value: 3.12.0
      - key: NODE_ENV
        value: production
    autoDeploy: true

  # Morning Brief - sends at 7:00 AM ET (11:00 UTC) on weekdays to all subscribed users
  - type: cron
    name: morning-brief
    runtime: python
    plan: starter
    schedule: "0 11 * * 1-5"  # 7:00 AM ET (11:00 UTC) on weekdays
    buildCommand: bash build.sh
    startCommand: curl -f -X POST "${RENDER_EXTERNAL_URL}/api/cron/morning-brief" || exit 0
    envVars:
      - key: NODE_VERSION
        value: 18
      - key: PYTHON_VERSION
        value: 3.12.0
      - key: NODE_ENV
        value: production
    autoDeploy: true

  # Nightly Brief - sends at 8:00 PM ET (00:00 UTC next day) Sun-Thu to all subscribed users
  - type: cron
    name: nightly-brief
    runtime: python
    plan: starter
    schedule: "0 0 * * 1-5"  # 8:00 PM ET Sun-Thu (00:00 UTC Mon-Fri)
    buildCommand: bash build.sh
    startCommand: curl -f -X POST -H "Authorization: Bearer ${CRON_SECRET}" "${RENDER_EXTERNAL_URL}/api/cron/nightly-brief" || exit 0
    envVars:
      - key: NODE_VERSION
        value: 18
      - key: PYTHON_VERSION
        value: 3.12.0
      - key: NODE_ENV
        value: production
    autoDeploy: true
