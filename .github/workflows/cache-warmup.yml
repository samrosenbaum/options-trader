name: Cache Warmup

on:
  schedule:
    # 9:25 AM ET (13:25 UTC) on weekdays
    - cron: '25 13 * * 1-5'
  workflow_dispatch: # Allow manual trigger

jobs:
  warmup:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger cache warmup
        run: |
          curl -f -X GET "${{ secrets.RENDER_EXTERNAL_URL }}/api/warmup-cache"
