name: Morning Brief

on:
  schedule:
    # 10:00 AM ET (15:00 UTC during EST, 14:00 UTC during EDT)
    # Using 15:00 UTC to ensure it runs after 9:30 AM market open during EST
    - cron: '0 15 * * 1-5'
  workflow_dispatch: # Allow manual trigger for testing

jobs:
  send:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger morning brief
        run: >
          curl -f -X POST
          -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}"
          "${{ secrets.RENDER_EXTERNAL_URL }}/api/cron/morning-brief"
